version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "5050:5000"
    environment:
      - PORT=5000
      - JWT_SECRET=student_management_secret
      - AUTH_SERVICE_URL=http://host.docker.internal:5001
      - STUDENT_SERVICE_URL=http://host.docker.internal:5002
      - COURSE_SERVICE_URL=http://host.docker.internal:5003
      - ENROLLMENT_SERVICE_URL=http://host.docker.internal:5004
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - auth-service
      - student-service
      - course-service
      - enrollment-service

  auth-service:
    build: ./auth-service
    container_name: auth-service
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - MONGO_URI=mongodb://host.docker.internal:27017/student_management
      - JWT_SECRET=student_management_secret
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - mongodb

  student-service:
    build: ./student-service
    container_name: student-service
    ports:
      - "5002:5002"
    environment:
      - PORT=5002
      - MONGO_URI=mongodb://host.docker.internal:27017/student_management
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - mongodb

  course-service:
    build: ./course-service
    container_name: course-service
    ports:
      - "5003:5003"
    environment:
      - PORT=5003
      - MONGO_URI=mongodb://host.docker.internal:27017/student_management
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - mongodb

  enrollment-service:
    build: ./enrollment-service
    container_name: enrollment-service
    ports:
      - "5004:5004"
    environment:
      - PORT=5004
      - MONGO_URI=mongodb://host.docker.internal:27017/student_management
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - mongodb

  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "5173:5173"
    depends_on:
      - api-gateway

volumes:
  mongo-data:
